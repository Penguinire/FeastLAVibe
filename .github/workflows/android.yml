
name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Geoapify
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo "::error::GEOAPIFY_API_KEY secret is missing or empty!"
            exit 1
          fi
          echo "GEOAPIFY_API_KEY=$GEOAPIFY_API_KEY" > local.properties
          echo "Geoapify API key configured successfully."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feast-Vibe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
